<section class="fields-list">
  <app-field-filters (filtersChange)="onFiltersChange($event)"></app-field-filters>

  <div class="fields-list__grid">
    <mat-card *ngFor="let field of filteredFields" class="fields-list__card">
      <mat-card-title>{{ field.name }}</mat-card-title>
      <mat-card-subtitle>{{ field.crop | translate }}</mat-card-subtitle>
      <mat-card-content>
        <p>{{ 'FIELDS.AREA' | translate:{ value: field.area } }}</p>
        <p>{{ ('FIELDS.STATUS.' + field.status) | translate }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary" [routerLink]="['/parcelles', field.id]">
          {{ 'FIELDS.VIEW_DETAIL' | translate }}
        </button>
      </mat-card-actions>
      <mat-divider></mat-divider>
      <mat-card-content>
        <app-field-actions-form (submitted)="onActionSubmit(field.id, $event)"></app-field-actions-form>
      </mat-card-content>
    </mat-card>
  </div>

  <section *ngIf="actionLogs.length > 0" class="fields-list__log">
    <h3>{{ 'FIELDS.ACTIONS.RECENT' | translate }}</h3>
    <mat-list>
      <mat-list-item *ngFor="let log of actionLogs">{{ log }}</mat-list-item>
    </mat-list>
  </section>
</section>
