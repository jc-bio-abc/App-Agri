<mat-card>
  <mat-toolbar color="primary">
    <span>Journal de suivi</span>
  </mat-toolbar>
  <mat-list *ngIf="entries.length; else empty">
    <mat-list-item *ngFor="let entry of entries; trackBy: trackById">
      <mat-icon matListItemIcon>event_note</mat-icon>
      <div matListItemTitle>{{ entry.message }}</div>
      <div matListItemLine>
        {{ entry.date | date: 'short' }} · {{ entry.author }}
      </div>
    </mat-list-item>
  </mat-list>
  <ng-template #empty>
    <div class="empty">Pas encore de notes</div>
  </ng-template>
</mat-card>
