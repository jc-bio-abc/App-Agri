<table mat-table [dataSource]="products" class="mat-elevation-z1">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>{{ 'PRODUCTS.NAME' | translate }}</th>
    <td mat-cell *matCellDef="let product">{{ product.name }}</td>
  </ng-container>
  <ng-container matColumnDef="stock">
    <th mat-header-cell *matHeaderCellDef>{{ 'PRODUCTS.STOCK' | translate }}</th>
    <td mat-cell *matCellDef="let product">{{ product.stock }}</td>
  </ng-container>
  <ng-container matColumnDef="unit">
    <th mat-header-cell *matHeaderCellDef>{{ 'PRODUCTS.UNIT' | translate }}</th>
    <td mat-cell *matCellDef="let product">{{ product.unit }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
