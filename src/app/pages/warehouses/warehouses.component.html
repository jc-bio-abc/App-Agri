<table mat-table [dataSource]="warehouses" class="mat-elevation-z1">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>{{ 'WAREHOUSES.NAME' | translate }}</th>
    <td mat-cell *matCellDef="let warehouse">{{ warehouse.name }}</td>
  </ng-container>

  <ng-container matColumnDef="capacity">
    <th mat-header-cell *matHeaderCellDef>{{ 'WAREHOUSES.CAPACITY' | translate }}</th>
    <td mat-cell *matCellDef="let warehouse">{{ warehouse.capacity }} t</td>
  </ng-container>

  <ng-container matColumnDef="occupation">
    <th mat-header-cell *matHeaderCellDef>{{ 'WAREHOUSES.OCCUPATION' | translate }}</th>
    <td mat-cell *matCellDef="let warehouse">
      <span
        [matBadge]="warehouse.occupation"
        [matBadgeColor]="getBadge(warehouse.occupation, warehouse.capacity)"
      >
        {{ (warehouse.occupation / warehouse.capacity) | percent:'1.0-0' }}
      </span>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
