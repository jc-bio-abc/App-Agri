name: Codex Decision Guard

on:
  push:
    branches: [ main, develop, feat/**, fix/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify journals updated when code changes
        run: node .github/workflows/verify-codex-logs.js
